apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: devops-practice
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "8080"
  FEATURE_SEARCH_ENABLED: "true"
  app-settings.json: |
    {
      "database": {
        "host": "postgres-service",
        "port": 5432,
        "maxConnections": 20
      },
      "cache": {
        "enabled": true,
        "ttlSeconds": 3600
      }
    }
